    - localhost
    - +.localhost
    - +.lan
    - +.local
    - +.home.arpa
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  default-nameserver:
    - https://1.1.1.1/dns-query#DIRECT
    - https://1.0.0.1/dns-query#DIRECT
